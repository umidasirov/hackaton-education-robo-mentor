# Development — hot reload bilan
# Ishlatish: docker compose -f docker-compose.dev.yml up --build
#
# Frontend:  http://localhost:5173  (Vite dev server, hot reload)
# Backend:   http://localhost:8001

services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend-dev
    container_name: velxio-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      # Faqat src va public mount — o'zgartirish srazu ko'rinadi
      - ./frontend/src:/app/frontend/src
      - ./frontend/public:/app/frontend/public
      - ./frontend/index.html:/app/frontend/index.html
    environment:
      - CHOKIDAR_USEPOLLING=true   # Windows uchun zarur (file watcher)
      - VITE_API_URL=http://localhost:8001
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: velxio-backend-dev
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/velxio.db
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
